<dialog id="share_dialog" class="modal" data-doc-id="{{ doc.id }}">
  <div class="modal-box share-dialog">
    <h3 class="modal-title">Share "{{ doc.title }}"</h3>
    <div class="alert alert-error share-dialog-error" hidden></div>
    <div class="share-dialog-section">
      <h4 class="share-dialog-heading">Create New Link</h4>
      <div class="share-dialog-create">
        <select class="select select-sm share-dialog-expiration" aria-label="Expiration">
          <option value="7days">Expires in 7 days</option>
          <option value="30days">Expires in 30 days</option>
          <option value="never">Never expires</option>
        </select>
        <button class="btn btn-primary btn-sm" data-action="create-share-link">
          {{ icon('link') }}
          Create
        </button>
      </div>
    </div>
    <div class="divider"></div>
    <div>
      <h4 class="share-dialog-heading">Existing Links</h4>
      <div class="share-dialog-loading" hidden>{{ icon('loader-pinwheel', 'page-spinner') }}</div>
      <p class="share-dialog-empty" hidden>No share links yet. Create one above.</p>
      <ul class="share-links"></ul>
    </div>
    <div class="modal-action">
      <form method="dialog">
        <button class="btn">Close</button>
      </form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
  <template class="share-link-template">
    <li class="share-link">
      <div class="share-link-info">
        <div class="share-link-token"></div>
        <div class="share-link-meta">
          <span class="share-link-expiry"></span>
          <span>&middot;</span>
          <span class="share-link-views"></span>
        </div>
      </div>
      <div class="share-link-actions">
        <button class="btn btn-ghost btn-xs" data-action="copy-share-link" title="Copy link">
          {{ icon('copy', 'share-link-copy') }}
          {{ icon('check', 'share-link-copied') }}
        </button>
        <button class="btn btn-ghost btn-xs share-link-delete" data-action="delete-share-link" title="Delete link">
          {{ icon('trash') }}
        </button>
      </div>
    </li>
  </template>
</dialog>
